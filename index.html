<title>Fiscalía Digital Transparente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Spectral:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: expediente institucional. Portada con índice de 11 puntos; cada punto es una "vista" con navegación anterior/siguiente para exponer. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eceff4; --ink:#14213a; --muted:#5a6578; --line:#d7dce5;
  --accent:#a3222d; --accent-soft:#f6e3e4; --data:#0d6e6b; --data-soft:#dcefee; --warn:#b56a00; --warn-soft:#fbeed8;
  --ok:#2c7a3f; --ok-soft:#e0f0e3; --hero:#14213a; --hero-fg:#f3f5f9; --hero-muted:#b6bfd0;
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1524; --surface:#161f31; --surface-2:#1e2940; --ink:#e7ebf3; --muted:#9aa5ba; --line:#2a3650;
  --accent:#ef6b74; --accent-soft:#3a1d24; --data:#4cc2bc; --data-soft:#123433; --warn:#f0a845; --warn-soft:#3a2b14;
  --ok:#6cc483; --ok-soft:#173222; --hero:#0a1020; --hero-fg:#eef1f7; --hero-muted:#9aa5ba; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1524; --surface:#161f31; --surface-2:#1e2940; --ink:#e7ebf3; --muted:#9aa5ba; --line:#2a3650;
  --accent:#ef6b74; --accent-soft:#3a1d24; --data:#4cc2bc; --data-soft:#123433; --warn:#f0a845; --warn-soft:#3a2b14;
  --ok:#6cc483; --ok-soft:#173222; --hero:#0a1020; --hero-fg:#eef1f7; --hero-muted:#9aa5ba; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.01em}
.eyebrow{font-size:.74rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hero);color:var(--hero-fg);border-bottom:3px solid var(--accent)}
.topbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}
.seal{width:30px;height:30px;border-radius:50%;border:2px solid var(--hero-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px}
.brand b{font-family:var(--f-display);font-size:1.05rem;font-weight:600}
.brand small{display:block;color:var(--hero-muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.dots{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.dots button{width:26px;height:26px;border-radius:6px;border:1px solid #ffffff33;background:transparent;color:var(--hero-muted);font:600 .72rem var(--f-body);cursor:pointer}
.dots button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.dots button:hover{border-color:var(--hero-fg);color:var(--hero-fg)}
.tool{background:transparent;border:1px solid #ffffff44;color:var(--hero-fg);border-radius:6px;padding:4px 10px;font:500 .8rem var(--f-body);cursor:pointer}
button:focus-visible,.card:focus-visible{outline:3px solid var(--data);outline-offset:2px}

/* portada */
.hero{background:var(--hero);color:var(--hero-fg)}
.hero .wrap{padding-block:44px 40px;display:grid;gap:22px}
.hero .eyebrow{color:var(--hero-muted)}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:700;max-width:18ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{color:var(--hero-muted);max-width:68ch;font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#ffffff22;border:1px solid #ffffff22;border-radius:var(--r);overflow:hidden}
.stat{background:var(--hero);padding:16px 18px;display:grid;gap:4px}
.stat .n{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}
.stat .n.red{color:var(--accent)}
.stat .l{font-size:.82rem;color:var(--hero-muted)}
.home-body{padding-block:36px 56px;display:grid;gap:22px}
.home-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.home-head h2{font-size:1.7rem}
.home-head p{color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 24px -14px #14213a66}
.card .num{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);font-weight:500}
.card h3{font-size:1.2rem}
.card p{color:var(--muted);font-size:.92rem}
.card .go{font-size:.8rem;font-weight:600;color:var(--data)}
.levels-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lv{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.lv.on{border-color:var(--data);background:var(--data-soft)}
.lv b{font-family:var(--f-display);font-size:1.05rem;display:block}
.lv span{font-size:.85rem;color:var(--muted)}

/* vista de punto */
.sec-head{background:var(--surface);border-bottom:1px solid var(--line)}
.sec-head .wrap{padding-block:28px 24px;display:grid;gap:10px}
.crumb{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--data);font:600 .85rem var(--f-body);cursor:pointer}
.sec-head h2{font-size:clamp(1.7rem,4vw,2.6rem)}
.sec-head .lead{color:var(--muted);max-width:75ch;font-size:1.05rem}
.big-n{font-family:var(--f-display);color:var(--accent);font-weight:700}
.sec-body{padding-block:28px 40px;display:grid;gap:30px}
.block{display:grid;gap:14px}
.block>h3{font-size:1.35rem;display:flex;gap:10px;align-items:baseline}
.block>h3 .mono{color:var(--muted);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.cols>*{min-width:0}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.red{background:var(--accent-soft);color:var(--accent)}
.pill.teal{background:var(--data-soft);color:var(--data)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.clean li{padding-left:18px;position:relative}
ul.clean li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.quote{font-family:var(--f-display);font-size:clamp(1.25rem,2.6vw,1.65rem);line-height:1.35;border-left:4px solid var(--accent);padding:4px 0 4px 18px;max-width:60ch}
.callout{border-radius:var(--r);padding:16px 18px;background:var(--accent-soft);border:1px solid var(--accent)}
.callout.teal{background:var(--data-soft);border-color:var(--data)}
.callout b{color:var(--accent)}
.callout.teal b{color:var(--data)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:600}
tr:last-child td{border-bottom:0}
td b{font-weight:600}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-block:8px 48px}
.pager button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:grid;gap:2px}
.pager button:hover{border-color:var(--accent)}
.pager .nx{text-align:right}
.pager small{color:var(--muted);font-size:.78rem}
.pager b{font-family:var(--f-display);font-size:1.05rem}
.pager button[disabled]{visibility:hidden}

/* componentes visuales */
.articles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.art{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;align-content:start}
.art.key{border:2px solid var(--accent)}
.art h4{margin:0;font-family:var(--f-display);font-size:1.05rem}
.art p{font-size:.92rem;color:var(--muted)}
.oe{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.oe div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;align-content:start}
.oe .code{font-family:var(--f-mono);color:var(--data);font-size:.8rem}
.oe b{font-size:1rem}
.oe p{font-size:.88rem;color:var(--muted)}
.goal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.goal div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center}
.goal .n{font-family:var(--f-display);font-size:2.2rem;font-weight:700;color:var(--data);line-height:1}
.goal span{font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.86rem}
.chip.hot{border-color:var(--accent);color:var(--accent);font-weight:600}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.gloss div{border-top:3px solid var(--data);background:var(--surface);padding:12px 14px;border-radius:0 0 var(--r) var(--r);border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.gloss b{display:block;font-family:var(--f-display);font-size:1.02rem}
.gloss span{font-size:.88rem;color:var(--muted)}

.timeline{position:relative;display:grid;gap:0;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 16px}
.tl::before{content:"";position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--data)}
.tl.red::before{border-color:var(--accent);background:var(--accent)}
.tl .d{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.tl b{display:block;font-weight:600}
.tl span{font-size:.86rem;color:var(--muted)}

.gauge{display:grid;gap:8px}
.gauge .bar{height:28px;background:var(--surface-2);border-radius:6px;overflow:hidden;position:relative}
.gauge .fill{height:100%;background:var(--accent);border-radius:6px 0 0 6px}
.gauge .lbls{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.gauge .big{font-family:var(--f-display);font-size:2.6rem;font-weight:700;color:var(--accent);line-height:1}

.foda{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foda>div{border-radius:var(--r);padding:14px 16px;border:1px solid var(--line);background:var(--surface);min-width:0}
.foda h4{margin:0 0 8px;font-family:var(--f-display);font-size:1.05rem}
.foda ul{margin:0;padding-left:18px;font-size:.9rem;display:grid;gap:4px}
.foda .f{border-top:4px solid var(--ok)} .foda .o{border-top:4px solid var(--data)}
.foda .d{border-top:4px solid var(--warn)} .foda .a{border-top:4px solid var(--accent)}

.stairs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.step{border-radius:var(--r) var(--r) 0 0;padding:16px;display:grid;gap:6px;align-content:start;border:1px solid var(--line);border-bottom:4px solid var(--data);background:var(--surface);min-width:0}
.step:nth-child(1){min-height:200px} .step:nth-child(2){min-height:250px} .step:nth-child(3){min-height:300px;background:var(--data-soft);border-color:var(--data)}
.step .k{font-family:var(--f-mono);font-size:.78rem;color:var(--data)}
.step h4{margin:0;font-family:var(--f-display);font-size:1.15rem}
.step p{font-size:.86rem;color:var(--muted)}
.step .now{font-size:.82rem}
.step .now b{color:var(--accent)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:600 .92rem var(--f-body);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.node{flex:1 0 150px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px}
.node b{font-family:var(--f-display);font-size:1.1rem}
.node span{font-size:.82rem;color:var(--muted)}
.arrow{flex:0 0 44px;display:grid;place-items:center;color:var(--data);font-size:1.4rem}
.clock{margin-top:10px;display:flex;gap:10px;align-items:center;font-size:.9rem}

.ring{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ring div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;align-content:start;min-width:0}
.ring .k{font-family:var(--f-mono);color:var(--data);font-size:.78rem}
.ring b{font-family:var(--f-display);font-size:1.02rem}
.ring p{font-size:.84rem;color:var(--muted)}
.base{margin-top:8px;background:var(--hero);color:var(--hero-fg);border-radius:var(--r);padding:16px;display:grid;gap:4px}
.base b{font-family:var(--f-display);font-size:1.1rem}
.base p{color:var(--hero-muted);font-size:.9rem}

.layers{display:grid;gap:6px}
.layer{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.layer b{font-family:var(--f-display)}
.layer span{font-size:.88rem;color:var(--muted)}
.layer:first-child{border-left:5px solid var(--accent)}
.layer:last-child{border-left:5px solid var(--data)}

.shield{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.shield div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:36px 1fr;gap:4px 10px;align-content:start}
.shield .i{grid-row:span 2;width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 .9rem var(--f-mono)}
.shield b{font-size:.95rem}
.shield p{font-size:.84rem;color:var(--muted)}

.steps14{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.steps14>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;align-content:start}
.steps14 .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.steps14 .k{font-family:var(--f-mono);color:var(--accent);font-size:.8rem}
.steps14 b{font-size:.98rem}
.steps14 p{font-size:.84rem;color:var(--muted)}
.steps14 small{font-size:.76rem;color:var(--data);font-weight:600}

.gantt{display:grid;gap:8px;min-width:640px}
.g-axis{position:relative;height:22px;margin-left:190px;border-bottom:1px solid var(--line)}
.g-axis span{position:absolute;top:0;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);transform:translateX(-50%)}
.g-row{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center}
.g-row .lbl{font-size:.86rem;font-weight:600}
.g-row .lbl small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.g-track{position:relative;height:34px;background:var(--surface-2);border-radius:6px}
.g-bar{position:absolute;top:4px;bottom:4px;border-radius:5px;background:var(--data);color:#fff;font-size:.74rem;font-weight:600;display:flex;align-items:center;padding:0 8px;overflow:hidden;white-space:nowrap}
.g-bar.f0{background:var(--accent)}
.g-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.g-desc{grid-column:2;font-size:.82rem;color:var(--muted);margin-top:-4px}

.stack{display:flex;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.stack div{display:flex;align-items:center;justify-content:center;color:#fff;font:600 .82rem var(--f-body);min-width:0}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:12px}
.legend div{display:grid;grid-template-columns:14px auto 1fr;gap:8px;align-items:start;font-size:.88rem}
.legend i{width:14px;height:14px;border-radius:3px;margin-top:4px}
.legend b{font-variant-numeric:tabular-nums}
.legend span{color:var(--muted)}

.kpi-feature{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.kf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.kf .t{font-size:.82rem;color:var(--muted);font-weight:600}
.kf .vals{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display)}
.kf .from{font-size:1.4rem;color:var(--muted)}
.kf .to{font-size:2.2rem;font-weight:700;color:var(--data);line-height:1}
.kf .ar{color:var(--muted)}
.kbar{position:relative;height:10px;background:var(--surface-2);border-radius:5px}
.kbar .m{position:absolute;top:0;bottom:0;left:0;background:var(--data);border-radius:5px;opacity:.35}
.kbar .b{position:absolute;top:-3px;width:4px;height:16px;background:var(--accent);border-radius:2px}
.kf small{font-size:.76rem;color:var(--muted)}
.cadence{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cadence div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:4px;align-content:start;min-width:0}
.cadence b{font-family:var(--f-display);color:var(--data)}
.cadence span{font-size:.84rem;color:var(--muted)}

.org{display:grid;gap:10px;justify-items:center}
.org .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;width:100%}
.org .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;align-content:start}
.org .box.top{border:2px solid var(--accent);max-width:520px;width:100%}
.org .box b{font-family:var(--f-display);font-size:1.05rem}
.org .box span{font-size:.84rem;color:var(--muted)}
.org .box em{font-style:normal;font-size:.84rem}
.org .vline{width:2px;height:16px;background:var(--line)}

.heat{display:grid;grid-template-columns:90px repeat(3,minmax(0,1fr));gap:6px;min-width:560px}
.heat .h{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center}
.heat .cell{border-radius:8px;padding:10px;min-height:96px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.heat .c1{background:var(--warn-soft)} .heat .c2{background:var(--accent-soft)} .heat .c3{background:var(--accent-soft);border:2px solid var(--accent)} .heat .c0{background:var(--surface-2)}
.heat .cell span{font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 7px}

.raci td.c{text-align:center;font-family:var(--f-mono);font-weight:500}
.r-R{background:var(--accent-soft);color:var(--accent)} .r-A{background:var(--data-soft);color:var(--data)} .r-C{background:var(--warn-soft);color:var(--warn)} .r-I{color:var(--muted)}

details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:10px}

.note{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:16px;font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

.view{animation:in .35s ease both}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.card{transition:none}}

@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ring,.cadence{grid-template-columns:repeat(2,minmax(0,1fr))}
  .layer{grid-template-columns:1fr;gap:2px}
  .dots{display:none}
}
@media (max-width:560px){
  .levels-strip,.stairs,.goal,.foda{grid-template-columns:1fr}
  .step:nth-child(n){min-height:0}
  .ring,.cadence{grid-template-columns:1fr}
  .pager{grid-template-columns:1fr}
  .hero .wrap{padding-block:30px}
}

  <div class="crumb"><button type="button" data-go="inicio">Portada</button><span>/</span><span>${s.ref}</span></div>
  <h2><span class="big-n">${pad(i+1)}</span> ${s.t}</h2>
  <p class="lead">${s.s}</p>
 </div></section>
 <div class="wrap sec-body">${V[s.id]()}</div>
 <div class="wrap pager">
  <button type="button" ${prev?`data-go="${prev.id}"`:"disabled"}><small>← Anterior</small><b>${prev?prev.t:""}</b></button>
  <button type="button" class="nx" data-go="${next?next.id:"inicio"}"><small>${next?"Siguiente →":"Volver →"}</small><b>${next?next.t:"Portada"}</b></button>
 </div></div>`;
};

const app = document.getElementById("app"), dots = document.getElementById("dots");
dots.innerHTML = S.map((s,i)=>`<button type="button" data-go="${s.id}" title="${s.t}">${i+1}</button>`).join("");
let cur = -1;

function show(id, push=true){
 const i = S.findIndex(s=>s.id===id);
 cur = i;
 app.innerHTML = i<0 ? home() : section(i);
 dots.querySelectorAll("button").forEach((b,k)=>b.setAttribute("aria-current", k===i));
 document.title = "Fiscalía Digital Transparente";
 if (id==="niveles") initTabs();
 window.scrollTo({top:0});
 if (push) try{ history.replaceState(null,"", i<0 ? location.pathname : "#"+id); }catch(e){}
}
function initTabs(){
 const tabs = document.querySelectorAll("#dom-tabs button"), panel = document.getElementById("dom-panel");
 const set = k => { tabs.forEach((t,j)=>t.setAttribute("aria-selected", j===k)); panel.innerHTML = DOM[k](); };
 tabs.forEach(t=>t.addEventListener("click",()=>set(+t.dataset.i)));
 set(0);
}
document.addEventListener("click", e=>{
 const g = e.target.closest("[data-go]");
 if (g) show(g.dataset.go);
});
document.getElementById("home-btn").addEventListener("click",()=>show("inicio"));
document.getElementById("fs-btn").addEventListener("click",()=>{
 const d = document.documentElement;
 try{ (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen()).catch(()=>{}); }catch(e){}
});
document.addEventListener("keydown", e=>{
 if (e.target.closest("input,textarea")) return;
 if (e.key==="ArrowRight"){ show(cur+1<S.length ? S[cur+1].id : "inicio"); }
 else if (e.key==="ArrowLeft"){ show(cur-1>=0 ? S[cur-1].id : "inicio"); }
 else if (e.key==="Home"||e.key==="Escape"&&!document.fullscreenElement){ show("inicio"); }
 else if (e.key==="f"||e.key==="F"){ document.getElementById("fs-btn").click(); }
});
window.addEventListener("hashchange",()=>show(location.hash.slice(1)||"inicio",false));
show(location.hash.slice(1)||"inicio", false);
</script>
